name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/main/java/dev/resumate/service/**'
      - 'src/main/java/dev/resumate/repository/**'
      - 'src/main/java/dev/resumate/controller/**'
      - 'src/test/java/dev/resumate/service/**'
      - '!docs/**'
      - '!**/*.md'
      - '!**/generated/**'

jobs:
  codex_review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    outputs:
      final_message: ${{ steps.read_final_message.outputs.final_message }}

    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Collect changed files in PR
        id: changed_files
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100
              }
            );

            const targets = files
              .map(f => f.filename)
              .filter(name =>
                name.startsWith('src/main/java/dev/resumate/service/') ||
                name.startsWith('src/main/java/dev/resumate/repository/') ||
                name.startsWith('src/main/java/dev/resumate/controller/') ||
                name.startsWith('src/test/java/dev/resumate/service/')
              )
              .filter(name =>
                !name.startsWith('docs/') &&
                !name.endsWith('.md') &&
                !name.includes('/generated/')
              );

            fs.writeFileSync('changed-files.json', JSON.stringify(targets, null, 2));
            core.setOutput('count', String(targets.length));

      - name: Stop if no target files
        if: steps.changed_files.outputs.count == '0'
        run: echo "No matching changed files."

      - name: Build isolated review workspace
        if: steps.changed_files.outputs.count != '0'
        run: |
          mkdir -p review-scope/.github/codex/prompts

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const files = JSON.parse(fs.readFileSync('changed-files.json', 'utf8'));

          for (const file of files) {
            const dest = path.join('review-scope', file);
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.copyFileSync(file, dest);
          }
          NODE

          cp .github/codex/prompts/review.md review-scope/.github/codex/prompts/review.md

          if [ -f AGENTS.md ]; then
            cp AGENTS.md review-scope/AGENTS.md
          fi

      - name: Install Codex CLI
        if: steps.changed_files.outputs.count != '0'
        run: npm install -g @openai/codex

      - name: Run Codex review in isolated workspace
        if: steps.changed_files.outputs.count != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec \
            --cd review-scope \
            --model gpt-5.4-mini \
            --sandbox workspace-write \
            --output-last-message final-message.txt \
            "$(cat review-scope/.github/codex/prompts/review.md)"

      - name: Read final message
        id: read_final_message
        run: |
          if [ -f review-scope/final-message.txt ]; then
            {
              echo 'final_message<<EOF'
              cat review-scope/final-message.txt
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'final_message<<EOF'
              echo ''
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

  post_review_comment:
    runs-on: ubuntu-latest
    needs: codex_review
    if: needs.codex_review.outputs.final_message != ''
    permissions:
      pull-requests: write

    steps:
      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.CODEX_FINAL_MESSAGE;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex_review.outputs.final_message }}